<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Life tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@500;700&display=swap" rel="stylesheet">
  <link
    href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>

<body>
  <main>
    <header class="top" id="top">
      <div id="hero"></div>
    </header>
    <div id="view"></div>
    <button class="ghost" id="reset" data-a="reset" hidden>Erase all data</button>
  </main>
  <dialog class="setupx" id="setupx" closedby="none" aria-labelledby="setup-t">
    <div class="setup-in">
      <p class="setup-k">Life Tracker · Quick setup</p>
      <h1 class="setup-t" id="setup-t">What would you like to track?</h1>
      <p class="setup-s">Start with the essentials. Add or remove any area later in Settings.</p>
      <div class="setup-core">Daily habits and wellbeing <small style="display:block;color:var(--mute);font-weight:400">Your simple home for routines, focus, and how you feel.</small></div>
      <div class="setup-list" role="group" aria-label="Optional tracking areas">
        <label class="setup-opt"><input type="checkbox" data-setup-area="faith"><span>Faith and adhkar<small>Prayer routine and daily adhkar</small></span></label>
        <label class="setup-opt"><input type="checkbox" data-setup-area="work"><span>Workday<small>Schedule, work time, and tasks</small></span></label>
        <label class="setup-opt"><input type="checkbox" data-setup-area="learn"><span>Learning<small>Study plan and weekly goals</small></span></label>
        <label class="setup-opt"><input type="checkbox" data-setup-area="money"><span>Money<small>Income, spending, and savings</small></span></label>
        <label class="setup-opt"><input type="checkbox" data-setup-area="digital"><span>Screen time<small>Phone and games tracking</small></span></label>
      </div>
      <div class="setup-actions"><button class="btn" data-a="setupDone">Get started</button></div>
      <button class="setup-skip" data-a="setupSkip">Keep only the essentials</button>
    </div>
  </dialog>
  <dialog class="agx" id="agx" closedby="none" aria-labelledby="agx-t"></dialog>
  <div id="toasts" aria-live="polite"></div>
  <nav class="dk" id="dk" aria-label="Pages"><button class="dk-hub" data-a="pgopen" aria-haspopup="dialog"
      aria-label="Open menu"><svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 7h16M4 12h16M4 17h10" />
      </svg></button>
    <div class="dk-ar"><button class="dk-a" data-a="pgstep" data-i="-1"
        aria-label="Previous page">&#8249;</button><small id="dkk">1 / 8</small><button class="dk-a" data-a="pgstep"
        data-i="1" aria-label="Next page">&#8250;</button></div>
  </nav>
  <div class="pgo" id="pgo" role="dialog" aria-modal="true" aria-label="All pages">
    <div class="pgo-bg" data-a="pgx"></div>
    <div class="pgs">
      <div class="pgs-h"><b>Pages</b></div>
      <div class="pgs-g2"><button class="pgt" data-a="pg" data-i="now"><span class="pgt-i"><svg viewBox="0 0 24 24"
              aria-hidden="true">
              <path d="M3 11l9-8 9 8" />
              <path d="M5 10v10h14V10" />
            </svg></span><span>Now</span></button><button class="pgt" data-a="pg" data-i="log"><span class="pgt-i"><svg
              viewBox="0 0 24 24" aria-hidden="true">
              <path d="M9 11l3 3 8-8" />
              <path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9" />
            </svg></span><span>Log</span></button><button class="pgt" data-a="pg" data-i="week"><span class="pgt-i"><svg
              viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 20V10M12 20V4M19 20v-7" />
            </svg></span><span>Week</span></button><button class="pgt" data-a="pg" data-i="learn"><span
            class="pgt-i"><svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 19.5V5a2 2 0 0 1 2-2h13v15H6a2 2 0 0 0-2 2z" />
              <path d="M4 19.5A2 2 0 0 0 6 22h13v-5" />
            </svg></span><span>Learn</span></button><button class="pgt" data-a="pg" data-i="archive"><span
            class="pgt-i"><svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="4" width="18" height="4" rx="1.5" />
              <path d="M5 8v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8" />
              <path d="M10 12h4" />
            </svg></span><span>Archive</span></button><button class="pgt" data-a="pg" data-i="adhkar"><span
            class="pgt-i"><svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" />
            </svg></span><span>Adhkar</span></button><button class="pgt" data-a="pg" data-i="money"><span
            class="pgt-i"><svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="8" />
              <path
                d="M14.5 9.5c-.5-.8-1.4-1.2-2.5-1.2-1.4 0-2.3.6-2.3 1.5s.9 1.3 2.3 1.6 2.3.7 2.3 1.6-.9 1.5-2.3 1.5c-1.2 0-2.1-.5-2.6-1.3M12 6.5v1.3M12 16.2v1.3" />
            </svg></span><span>Money</span></button><button class="pgt" data-a="pg" data-i="set"><span
            class="pgt-i"><svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="3" />
              <path
                d="M12 2.5v2.7M12 18.8v2.7M2.5 12h2.7M18.8 12h2.7M5.3 5.3l1.9 1.9M16.8 16.8l1.9 1.9M5.3 18.7l1.9-1.9M16.8 7.2l1.9-1.9" />
            </svg></span><span>Settings</span></button></div>
      <div id="pgacc"></div>
    </div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>

</html>
