<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Life tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@500;700&display=swap" rel="stylesheet"
    media="print" onload="this.media='all'">
  <link
    href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap"
    rel="stylesheet" media="print" onload="this.media='all'">
  <style>
    :root {
      --bg: #F2EEE6;
      --sf: #FBF9F4;
      --ink: #26231E;
      --mute: #6A6458;
      --line: #E4DDD0;
      --soft: #EEE8DB;
      --acc: #2C6E7F;
      --acct: #245C6B;
      --ok: #4B7F52;
      --okbg: #E5EEE1;
      --warn: #D99A2B;
      --late: #9A4A1A;
      color-scheme: light;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px)
    }

    * {
      box-sizing: border-box
    }

    [hidden] {
      display: none !important
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent
    }

    main {
      max-width: 560px;
      margin: 0 auto;
      padding: 14px 16px calc(100px + env(safe-area-inset-bottom, 0px))
    }

    h1,
    h2,
    .tnum,
    .kpi b,
    .big {
      font-family: "Reem Kufi", system-ui, sans-serif;
      letter-spacing: -.01em
    }

    h1 {
      margin: 0;
      font-size: 25px;
      line-height: 1.1;
      color: #fff
    }

    h2 {
      margin: 24px 4px 8px;
      font-size: 18px;
      font-weight: 700
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 18px;
      border-radius: 18px;
      color: #fff;
      background: linear-gradient(135deg, #0F1A30, #1D2B4A);
      box-shadow: 0 6px 18px rgba(15, 26, 48, .28)
    }

    .top p {
      margin: 6px 0 0;
      color: rgba(255, 255, 255, .82);
      font-size: 14px
    }

    .badge {
      display: inline-block;
      margin-bottom: 8px;
      padding: 2px 10px;
      border-radius: 20px;
      background: #2358C9;
      color: #fff;
      font-size: 12px;
      font-weight: 700
    }

    .ring {
      position: relative;
      width: 84px;
      height: 84px;
      flex: none
    }

    .ring svg {
      width: 84px;
      height: 84px;
      transform: rotate(-90deg)
    }

    .ring circle {
      fill: none;
      stroke-width: 8
    }

    .ring .bg {
      stroke: rgba(255, 255, 255, .18)
    }

    .ring .fg {
      stroke: #8FB04A;
      stroke-linecap: round;
      transition: stroke-dashoffset .4s
    }

    .ring b {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font: 700 20px "Reem Kufi", system-ui, sans-serif
    }

    .top.full .ring .fg {
      stroke: #FBBF24
    }

    @keyframes glow {

      0%,
      100% {
        box-shadow: 0 6px 18px rgba(15, 26, 48, .28)
      }

      50% {
        box-shadow: 0 0 0 4px rgba(52, 211, 153, .4), 0 8px 28px rgba(52, 211, 153, .45)
      }
    }

    .top.glow {
      animation: glow 1.4s ease-in-out 1
    }

    .strip {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      margin-top: 14px
    }

    .strip button {
      border: 1px solid var(--line);
      background: var(--sf);
      color: var(--ink);
      border-radius: 10px;
      padding: 6px 0 0;
      min-height: 54px;
      font: inherit;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow: hidden;
      cursor: pointer
    }

    .strip button[aria-pressed="true"] {
      border-color: var(--acc);
      background: var(--soft);
      box-shadow: 0 0 0 2px var(--acc)
    }

    .strip i {
      display: block;
      width: 100%;
      background: var(--acc)
    }

    .box {
      background: var(--sf);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 4px 14px
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 52px;
      border-top: 1px solid var(--line)
    }

    .row:first-child {
      border-top: 0
    }

    .row small,
    .note {
      display: block;
      color: var(--mute);
      font-size: 13px
    }

    .note {
      margin: 0 4px 8px
    }

    .pad {
      padding: 14px 0
    }

    .mut {
      color: var(--mute);
      margin: 0
    }

    .acts {
      display: flex;
      align-items: center;
      gap: 6px
    }

    .chk {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      border: 2px solid var(--line);
      background: transparent;
      color: #fff;
      font-size: 22px;
      cursor: pointer;
      flex: none
    }

    .chk[aria-pressed="true"] {
      background: var(--ok);
      border-color: var(--ok)
    }

    .chips {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px
    }

    .chip {
      min-height: 54px;
      border-radius: 12px;
      border: 2px solid var(--line);
      background: var(--sf);
      color: var(--ink);
      font: inherit;
      font-size: 13px;
      cursor: pointer;
      padding: 4px 0
    }

    .chip[aria-pressed="true"] {
      background: var(--acc);
      border-color: var(--acc);
      color: #fff;
      font-weight: 700
    }

    .btn {
      min-height: 44px;
      padding: 0 16px;
      border: 0;
      border-radius: 10px;
      background: var(--acct);
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none
    }

    .btn.alt {
      background: var(--soft);
      color: var(--ink);
      border: 1px solid var(--line)
    }

    .del {
      width: 44px;
      height: 44px;
      border: 0;
      background: transparent;
      color: var(--mute);
      font-size: 22px;
      cursor: pointer
    }

    input[type=time],
    input[type=date],
    input[type=number],
    input[type=text],
    textarea,
    select {
      font: inherit;
      font-size: 16px;
      color: var(--ink);
      background: var(--soft);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 10px;
      min-height: 44px;
      max-width: 100%
    }

    textarea {
      width: 100%;
      resize: vertical
    }

    .add {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      padding: 12px 0
    }

    .add input[type=text],
    .add select {
      flex: 1;
      min-width: 110px
    }

    .num {
      width: 92px
    }

    .bar {
      height: 10px;
      border-radius: 10px;
      background: var(--line);
      overflow: hidden;
      margin: 8px 0 4px
    }

    .bar i {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, var(--acc), var(--ok));
      transition: width .3s
    }

    .kpi {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 14px
    }

    .kpi div {
      background: var(--sf);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 6px;
      text-align: center
    }

    .kpi b {
      display: block;
      font-size: 20px;
      font-variant-numeric: tabular-nums
    }

    .kpi span {
      font-size: 12px;
      color: var(--mute)
    }

    .kpi.k4 {
      grid-template-columns: repeat(4, 1fr);
      gap: 6px
    }

    .kpi.k4 div {
      padding: 10px 2px
    }

    .kpi.k4 b {
      font-size: 17px
    }

    .kpi.k4 span {
      font-size: 11px;
      display: block;
      line-height: 1.25
    }

    .big {
      font-size: 30px;
      font-weight: 700;
      display: block;
      line-height: 1.1
    }

    .ok {
      color: var(--ok);
      font-weight: 700
    }

    .late {
      color: var(--late);
      font-weight: 700
    }

    .verdict {
      margin: 14px 0 0;
      padding: 10px 12px;
      border-left: 4px solid var(--acc);
      background: var(--sf);
      border-radius: 0 10px 10px 0;
      font-weight: 600
    }

    .banner {
      margin-top: 16px;
      padding: 16px;
      border-radius: 16px;
      color: #fff;
      background: linear-gradient(135deg, #1D4ED8, #2358C9)
    }

    .banner b {
      font-size: 13px;
      font-weight: 600;
      opacity: .92
    }

    .banner h2 {
      margin: 2px 0 0;
      color: #fff
    }

    .banner p {
      margin: 6px 0 0;
      opacity: .92
    }

    .banner .btn {
      margin-top: 12px;
      background: #fff;
      color: #1D4ED8
    }

    .timer {
      text-align: center;
      padding: 16px 14px
    }

    .tnum {
      font-size: 56px;
      font-weight: 700;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      margin: 12px 0 4px
    }

    .ctl {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-top: 12px;
      flex-wrap: wrap
    }

    .tl .tli {
      display: grid;
      grid-template-columns: 46px 28px 1fr 32px;
      gap: 8px;
      padding: 8px 0;
      align-items: start
    }

    .tli .tt {
      color: var(--mute);
      font-size: 13px;
      font-variant-numeric: tabular-nums;
      padding-top: 3px
    }

    .tli .dt {
      position: relative;
      display: flex;
      justify-content: center
    }

    .tli .dt::before {
      content: "";
      position: absolute;
      top: 26px;
      bottom: -16px;
      width: 2px;
      background: var(--line)
    }

    .tli:last-child .dt::before {
      display: none
    }

    .tli .dt button,
    .tli .dt i {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid var(--line);
      background: var(--sf);
      font-style: normal;
      display: grid;
      place-items: center;
      font-size: 13px;
      color: #fff;
      padding: 0;
      cursor: pointer;
      position: relative;
      z-index: 1
    }

    .tli .dt button::after {
      content: "";
      position: absolute;
      inset: -12px
    }

    .tli .tn small {
      display: block;
      color: var(--mute);
      font-size: 12px
    }

    .s-done .dt i,
    .tli .dt button[aria-pressed="true"] {
      background: var(--ok);
      border-color: var(--ok)
    }

    .xd {
      width: 32px;
      height: 32px;
      border: 0;
      background: none;
      color: var(--mute);
      font-size: 20px;
      cursor: pointer;
      position: relative
    }

    .xd::after {
      content: "";
      position: absolute;
      inset: -6px
    }

    .s-done .tn {
      color: var(--mute)
    }

    .s-cur .dt button,
    .s-cur .dt i {
      border-color: var(--acc);
      box-shadow: 0 0 0 4px rgba(47, 111, 219, .22)
    }

    .s-cur .tn {
      font-weight: 700
    }

    .s-past {
      opacity: .6
    }

    .scale {
      margin: 12px 0
    }

    .scale .chips {
      margin-top: 6px
    }

    .scale .lh {
      display: flex;
      justify-content: space-between;
      color: var(--mute);
      font-size: 12px;
      margin-top: 4px
    }

    .grid24 {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 6px;
      padding: 12px 0
    }

    .grid24 button {
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--sf);
      color: var(--ink);
      font: inherit;
      font-size: 13px;
      cursor: pointer
    }

    .grid24 button.full {
      background: var(--okbg);
      color: var(--ok);
      border-color: var(--ok);
      font-weight: 700
    }

    .grid24 button[aria-pressed="true"] {
      border-color: var(--acc);
      box-shadow: 0 0 0 2px var(--acc)
    }

    .two {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 12px 0
    }

    .two button {
      min-height: 48px;
      border: 2px solid var(--line);
      border-radius: 12px;
      background: var(--sf);
      color: var(--ink);
      font: inherit;
      cursor: pointer
    }

    .two button[aria-pressed="true"] {
      background: var(--acc);
      border-color: var(--acc);
      color: #fff;
      font-weight: 700
    }

    .card {
      background: var(--sf);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
      margin-top: 12px
    }

    .qa {
      font-weight: 700;
      font-size: 17px;
      margin: 0 0 10px
    }

    .ghost {
      width: 100%;
      min-height: 44px;
      margin-top: 20px;
      border: 1px solid var(--line);
      background: var(--sf);
      color: var(--mute);
      border-radius: 10px;
      font: inherit;
      cursor: pointer
    }

    a {
      color: var(--acct)
    }

    .tabs {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
      background: var(--sf);
      border-top: 1px solid var(--line);
      box-shadow: 0 -2px 12px rgba(15, 26, 48, .08);
      z-index: 30
    }

    .tabs button {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      min-height: 52px;
      border: 0;
      border-radius: 12px;
      background: none;
      color: var(--mute);
      font: inherit;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer
    }

    .tabs button svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    .tabs button[aria-pressed="true"] {
      background: var(--soft);
      color: var(--acct)
    }

    @keyframes pop {
      0% {
        transform: scale(.86)
      }

      60% {
        transform: scale(1.1)
      }

      100% {
        transform: scale(1)
      }
    }

    .pop {
      animation: pop .24s ease-out
    }

    @keyframes fadein {
      from {
        opacity: 0;
        transform: translateY(6px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    .fade {
      animation: fadein .22s ease-out
    }

    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible,
    select:focus-visible,
    a:focus-visible {
      outline: 3px solid var(--acc);
      outline-offset: 2px
    }

    @media (min-width:900px) {
      main {
        max-width: 720px
      }

      .tabs {
        max-width: 560px;
        left: 50%;
        right: auto;
        width: 100%;
        transform: translateX(-50%);
        border: 1px solid var(--line);
        border-radius: 16px 16px 0 0
      }
    }

    @media (prefers-reduced-motion:reduce) {
      * {
        animation: none !important;
        transition: none !important
      }
    }

    .chip b {
      display: block;
      font-size: 16px
    }

    .chip small {
      display: block;
      font-size: 11px;
      font-weight: 500
    }

    .pills {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 14px 0 4px;
      scrollbar-width: none
    }

    .pills button {
      flex: none;
      min-height: 40px;
      padding: 0 14px;
      border-radius: 20px;
      border: 1px solid var(--line);
      background: var(--sf);
      color: var(--mute);
      font: inherit;
      font-weight: 600;
      cursor: pointer
    }

    .pills button[aria-pressed="true"] {
      background: var(--acct);
      border-color: var(--acct);
      color: #fff
    }

    .secgrid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px
    }

    .sec {
      text-align: left;
      background: var(--sf);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      cursor: pointer;
      color: var(--ink);
      font: inherit
    }

    .sec b {
      display: block;
      font-size: 16px;
      margin-top: 8px
    }

    .sec small {
      color: var(--mute)
    }

    .si {
      display: inline-grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: var(--soft);
      color: var(--acct)
    }

    .si svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    .sec.done .si {
      background: var(--okbg);
      color: var(--ok)
    }

    .sum {
      display: flex;
      align-items: center;
      gap: 16px
    }

    .sbig {
      text-align: center;
      min-width: 84px
    }

    .sbig small {
      display: block;
      color: var(--mute);
      font-size: 12px
    }

    .sbars {
      flex: 1
    }

    .sbars>div {
      margin-bottom: 8px
    }

    .sbars small {
      color: var(--mute);
      font-size: 12px
    }

    .glasses {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(34px, 1fr));
      gap: 8px;
      padding: 12px 0
    }

    .gl {
      height: 50px;
      border: 2px solid var(--line);
      border-radius: 6px 6px 14px 14px;
      background: var(--sf);
      cursor: pointer
    }

    .gl[aria-pressed="true"] {
      border-color: var(--acc);
      background: linear-gradient(180deg, #DCE9FF 15%, #5C93EC)
    }

    .qc {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      padding: 12px 0
    }

    .qc button {
      min-height: 40px;
      padding: 0 14px;
      border-radius: 20px;
      border: 1px solid var(--line);
      background: var(--soft);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      color: var(--ink)
    }

    .stp {
      display: inline-flex;
      align-items: center;
      gap: 6px
    }

    .stp button {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--soft);
      font-size: 20px;
      color: var(--ink);
      cursor: pointer
    }

    .stp .num {
      width: 76px;
      text-align: center
    }

    #toasts {
      position: fixed;
      top: calc(8px + env(safe-area-inset-top, 0px));
      left: 0;
      right: 0;
      z-index: 60;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      pointer-events: none
    }

    .toast {
      pointer-events: auto;
      width: min(92%, 440px);
      background: #0F1A30;
      color: #fff;
      border-radius: 14px;
      padding: 12px 14px;
      box-shadow: 0 8px 24px rgba(15, 26, 48, .4);
      display: flex;
      gap: 10px;
      align-items: center;
      animation: fadein .2s ease-out
    }

    .toast b {
      display: block
    }

    .toast small {
      color: rgba(255, 255, 255, .82);
      font-size: 13px
    }

    .toast .btn {
      min-height: 36px;
      padding: 0 12px;
      background: #fff;
      color: #1D4ED8
    }

    .toast .x {
      border: 0;
      background: none;
      color: #fff;
      font-size: 22px;
      width: 32px;
      height: 32px;
      cursor: pointer
    }

    .dnav {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 14px
    }

    .dnav .btn {
      min-width: 44px;
      padding: 0 12px;
      font-size: 20px
    }

    .dnav .btn[disabled],
    .wnavr .btn[disabled] {
      opacity: .4
    }

    .dlab {
      position: relative;
      flex: 1;
      text-align: center;
      font-weight: 700;
      padding: 10px 6px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--sf)
    }

    .dlab input {
      position: absolute;
      inset: 0;
      opacity: 0;
      width: 100%;
      height: 100%;
      cursor: pointer
    }

    .wnavr {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
      margin-top: 14px;
      text-align: center
    }

    .wnavr .btn {
      min-width: 44px;
      font-size: 20px
    }

    .chipx {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      background: var(--soft);
      color: var(--mute)
